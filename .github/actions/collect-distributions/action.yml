name: collect distributions
description: >
  Put the sdist and wheel to be published into ./dist, from this run when there
  is one, or from an already-published release when re-publishing.

inputs:
  publish_only:
    description: "true when re-publishing a release that was already built and certified"
    required: false
    default: "false"
  tag:
    description: "the tag being published"
    required: true
  github_token:
    required: true

runs:
  using: composite
  steps:
    - name: fetch the distributions built in this run
      if: inputs.publish_only != 'true'
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist

    - name: fetch the distributions from the release being published
      if: inputs.publish_only == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        set -euo pipefail
        gh release download "${{ inputs.tag }}" --dir dist \
          --pattern '*.whl' --pattern '*.tar.gz'
        gh release download "${{ inputs.tag }}" --dir certification \
          --pattern 'certification-*.json'

    - name: the release must carry passing certification reports
      # publish_only exists so that a failure *after* certification can be
      # retried without paying for the GPUs again. It must not become a way to
      # publish something uncertified, so it checks the evidence attached to the
      # release instead of trusting that a job once went green.
      if: inputs.publish_only == 'true'
      shell: bash
      run: |
        python - <<'PY'
        import json, pathlib, sys

        reports = sorted(pathlib.Path("certification").glob("certification-*.json"))
        if not reports:
            sys.exit("::error::the release carries no certification report; refusing to publish")

        architectures = set()
        for path in reports:
            data = json.loads(path.read_text())
            status = "passed" if data.get("passed") else "FAILED"
            print(f"{path.name}: {status} "
                  f"({data['candidate_backend']} vs {data['reference_backend']}, "
                  f"max_abs={data['max_abs_error']:.3e})")
            if not data.get("passed"):
                sys.exit(f"::error::{path.name} did not pass; refusing to publish")
            architectures.add(path.name.split("-")[1])

        missing = {"sm80", "sm90"} - architectures
        if missing:
            sys.exit(f"::error::no passing report for {sorted(missing)}; refusing to publish")
        print(f"{len(reports)} passing reports covering {sorted(architectures)}")
        PY

    - name: refuse to publish nothing
      shell: bash
      run: |
        count=$(ls dist/*.whl dist/*.tar.gz 2>/dev/null | wc -l)
        ls -l dist
        [ "$count" -ge 2 ] || { echo "::error::expected a wheel and an sdist, found $count"; exit 1; }
