name: certify-cuda-sm80

# Manual entry point for certifying sm_80 on the A100 pod. The work lives in
# certify-cuda.yml; this only names the architecture and the pod, so that the
# two architectures stay one file apart rather than one copied file apart.
#
# release.yml calls certify-cuda.yml directly, and in that case the wheels come
# from the same run, so wheel_run_id is not needed.

on:
  workflow_dispatch:
    inputs:
      wheel_run_id:
        description: "build-cuda-wheels run holding the wheels to certify"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  certify:
    uses: ./.github/workflows/certify-cuda.yml
    permissions:
      contents: read
      actions: read
      # certify-cuda mints a runner registration token, which is a repository
      # administration call. A callee can only downgrade what the caller
      # grants, so it has to be granted here.
      administration: write
    with:
      arch: sm80
      wheel_run_id: ${{ inputs.wheel_run_id }}
    secrets: inherit
