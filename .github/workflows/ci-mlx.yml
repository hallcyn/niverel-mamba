name: ci-mlx

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mlx:
    runs-on: macos-14
    # Shares one serialising concurrency group with ci-macos-mps's hosted job:
    # macOS minutes count 10x against the quota and the two have no reason to
    # overlap. See that workflow for the full note.
    concurrency:
      group: macos-hosted-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: install MLX plus torch (needed as the comparison reference)
        run: |
          uv venv --python 3.12
          uv pip install -e ".[mlx,torch,dev]"
      - run: uv run niverel-mamba doctor
      - run: uv run python scripts/make_golden_fixture.py
      - name: pure MLX tests, weight conversion, and parity against torch CPU
        run: uv run pytest tests/mlx -q
      - name: certification report
        run: |
          uv run niverel-mamba verify --fixture segmented --mlx --report mlx-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlx-certification
          path: mlx-report.json
