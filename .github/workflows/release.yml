name: release

# Ordered exactly as the brief specifies:
#   build core -> test core -> build CUDA assets -> cold-install them ->
#   certify on GPU -> final manifest -> GitHub Release -> PyPI ->
#   cold-install from PyPI
#
# The ordering is the point: nothing is published before the thing that would
# have caught it having been wrong has run.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to release, e.g. v0.1.0"
        required: true
      wheel_run_id:
        description: "build-cuda-wheels run to certify and attach (omit to release core only)"
        required: false

permissions:
  contents: read

jobs:
  build-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --extra torch --extra dev
      - run: uv run ruff check . && uv run mypy src
      - run: uv run python scripts/make_golden_fixture.py
      - run: uv run pytest -q
      - run: uv run python -m build
      - run: uv run twine check dist/*
      - uses: actions/upload-artifact@v7
        with: { name: dist, path: dist/ }

  certify-gpu:
    # Skipped when no CUDA build was nominated. When it IS nominated, its
    # success is what allows the wheels to be attached to the release.
    needs: build-core
    if: inputs.wheel_run_id != ''
    # certify-cuda-sm80.yml needs `actions: read` to download artefacts from
    # the nominated build run. A caller must grant everything the callee
    # requests, and this is validated when the FILE is parsed -- the `if:`
    # above does not save you. Getting it wrong makes the whole release
    # workflow refuse to start with "requesting 'actions: read', but is only
    # allowed 'actions: none'".
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/certify-cuda-sm80.yml
    with:
      wheel_run_id: ${{ inputs.wheel_run_id }}
    secrets: inherit

  github-release:
    needs: [build-core, certify-gpu]
    # `!cancelled()` rather than `always()`: a cancelled release must not go on
    # to cut a GitHub Release.
    if: >-
      !cancelled()
      && needs.build-core.result == 'success'
      && (needs.certify-gpu.result == 'success' || needs.certify-gpu.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Downloaded by name into a known directory rather than dumping every
      # artifact into one tree and globbing it. The previous form attached
      # nothing at all -- `artifacts/dist/*` matched no files -- and the release
      # still reported success because unmatched patterns are not fatal.
      - name: fetch the built distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: fetch certified CUDA wheels, if this release has any
        if: needs.certify-gpu.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: cuda-wheels-*
          path: cuda-wheels
          merge-multiple: true

      - name: list exactly what will be attached
        run: |
          echo "distributions:"
          ls -l dist
          echo "CUDA wheels:"
          ls -l cuda-wheels 2>/dev/null || echo "  none (core-only release)"

      - name: every CUDA asset must match the SHA-256 in its manifest
        run: python scripts/verify_release_assets.py --wheelhouse cuda-wheels --allow-empty

      - name: refuse to publish a release with no distributions
        run: |
          count=$(ls dist/*.whl dist/*.tar.gz 2>/dev/null | wc -l)
          [ "$count" -ge 2 ] || { echo "::error::expected a wheel and an sdist, found $count"; exit 1; }

      - uses: softprops/action-gh-release@v3
        with:
          # Explicit, because the two entry points disagree about `github.ref`:
          # a tag push gives the tag, a workflow_dispatch gives the branch it
          # was launched from. Relying on the default would cut a release named
          # after a branch -- and workflow_dispatch is the only way to attach
          # CUDA wheels, since `wheel_run_id` cannot be supplied by a tag push.
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/*
            cuda-wheels/*
          generate_release_notes: true
          fail_on_unmatched_files: false

  publish-testpypi:
    needs: github-release
    # `certify-gpu` is skipped for a core-only release, and GitHub propagates a
    # skip transitively to every descendant that does not override `if`. The
    # `always()` on github-release rescues that job only -- not its dependants.
    # Without this line both publish jobs are silently skipped and the release
    # reports success having published nothing.
    if: "!cancelled() && needs.github-release.result == 'success'"
    # A called workflow can only ever DOWNGRADE the caller's permissions, so
    # `id-token: write` has to be granted here. Declaring it only inside
    # publish-pypi.yml leaves the OIDC token unavailable and Trusted Publishing
    # fails with "unable to get ACTIONS_ID_TOKEN_REQUEST_URL".
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-pypi.yml
    with:
      repository: testpypi
    secrets: inherit

  publish-pypi:
    needs: publish-testpypi
    # `certify-gpu` is skipped for a core-only release, and GitHub propagates a
    # skip transitively to every descendant that does not override `if`. The
    # `always()` on github-release rescues that job only -- not its dependants.
    # Without this line both publish jobs are silently skipped and the release
    # reports success having published nothing.
    if: "!cancelled() && needs.publish-testpypi.result == 'success'"
    # A called workflow can only ever DOWNGRADE the caller's permissions, so
    # `id-token: write` has to be granted here. Declaring it only inside
    # publish-pypi.yml leaves the OIDC token unavailable and Trusted Publishing
    # fails with "unable to get ACTIONS_ID_TOKEN_REQUEST_URL".
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-pypi.yml
    with:
      repository: pypi
    secrets: inherit
