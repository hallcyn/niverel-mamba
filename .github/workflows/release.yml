name: release

# One tag, one release. Push `v0.1.0` and everything below happens in order,
# with a single human decision in the middle.
#
#   build-core       tests, sdist and wheel                    ~2 min
#   build-cuda       three CUDA runtimes, in parallel          ~70 min
#   certify-sm80     on a RunPod A100, after your approval     ~20 min
#   certify-sm90     on a RunPod H100, after your approval     ~20 min
#   github-release   the release, with every artefact attached
#   publish-testpypi TestPyPI, then a cold install from it
#   publish-pypi     PyPI, gated by its own environment
#
# The ordering is the safety property: nothing is published before the thing
# that would have caught it wrong has run. Certification failing stops the
# release outright -- a version number on PyPI can never be reused, and an
# uncertified CUDA wheel must never reach a user.
#
# GPU cost is bounded by approval on the `gpu` environment, a hard timeout on
# each certification job, and a guard that fails if any pod is left running.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to release, e.g. v0.1.0"
        required: true
      publish_only:
        description: >
          publish a tag that was already built and certified, without rebuilding
          or re-renting a GPU. The certification reports attached to the release
          are re-checked before anything is uploaded.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-core:
    # Everything up to and including github-release is skipped when
    # re-publishing an already-certified tag.
    if: ${{ !inputs.publish_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --extra torch --extra dev
      - run: uv run ruff check . && uv run mypy src
      - run: uv run python scripts/make_golden_fixture.py
      - run: uv run pytest -q
      - run: uv run python -m build
      - run: uv run twine check dist/*
      - uses: actions/upload-artifact@v7
        with: { name: dist, path: dist/ }

  build-cuda:
    needs: build-core
    if: ${{ !cancelled() && !inputs.publish_only && needs.build-core.result == 'success' }}
    uses: ./.github/workflows/build-cuda-wheels.yml
    permissions:
      contents: read
      # The build pushes its layer cache to GHCR, and a callee can only ever
      # downgrade what the caller grants.
      packages: write
    with:
      target: all
    secrets: inherit

  certify-sm80:
    needs: build-cuda
    if: ${{ !cancelled() && !inputs.publish_only && needs.build-cuda.result == 'success' }}
    uses: ./.github/workflows/certify-cuda.yml
    permissions:
      contents: read
      actions: read
    with:
      arch: sm80
    secrets: inherit

  certify-sm90:
    # Deliberately after sm80 rather than beside it: two GPUs billing at once
    # for no gain, and if sm80 already found a regression there is nothing to
    # learn from paying for an H100 to find the same one.
    needs: certify-sm80
    if: ${{ !cancelled() && !inputs.publish_only && needs.certify-sm80.result == 'success' }}
    uses: ./.github/workflows/certify-cuda.yml
    permissions:
      contents: read
      actions: read
    with:
      arch: sm90
    secrets: inherit

  github-release:
    needs: [build-core, build-cuda, certify-sm80, certify-sm90]
    if: ${{ !cancelled() && !inputs.publish_only && needs.certify-sm90.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # By name into known directories rather than one tree and a glob: an
      # earlier version attached nothing at all because `artifacts/dist/*`
      # matched no files, and unmatched patterns are not fatal.
      - name: fetch the built distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: fetch the certified CUDA wheels
        uses: actions/download-artifact@v8
        with:
          pattern: cuda-wheels-*
          path: cuda-wheels
          # NOT merged: every target ships a manifest.json and wheels with
          # identical filenames, so merging leaves one target's manifest beside
          # another's wheels. Release assets are a flat namespace too, so the
          # three sets are attached as one archive each.
          merge-multiple: false

      - name: fetch the certification reports
        uses: actions/download-artifact@v8
        with:
          pattern: certification-*
          path: certification
          merge-multiple: true

      - name: every CUDA asset must match the SHA-256 in its manifest
        run: python scripts/verify_release_assets.py --wheelhouse cuda-wheels --allow-empty

      - name: pack one archive per runtime
        # A user needs to know which runtime a wheel was built for, and the
        # wheel filename cannot say: tags encode neither the torch nor the CUDA
        # version. Renaming the wheel is not an option either -- pip validates
        # the filename against the metadata and rejects a mismatch. So the
        # runtime lives in the archive name, and each archive carries the
        # manifest that describes what is inside it.
        run: |
          set -euo pipefail
          mkdir -p assets
          for dir in cuda-wheels/cuda-wheels-*/; do
            target=$(basename "$dir" | sed 's/^cuda-wheels-//')
            (cd "$dir" && zip -qr "$GITHUB_WORKSPACE/assets/niverel-mamba-cuda-$target.zip" .)
            cp "$dir/manifest.json" "assets/manifest-$target.json"
          done
          ls -l assets

      - name: list exactly what will be attached
        run: |
          echo "distributions:"; ls -l dist
          echo "CUDA archives:"; ls -l assets
          echo "reports:";       ls -l certification

      - name: refuse to publish a release with no distributions
        run: |
          count=$(ls dist/*.whl dist/*.tar.gz 2>/dev/null | wc -l)
          [ "$count" -ge 2 ] || { echo "::error::expected a wheel and an sdist, found $count"; exit 1; }

      - name: every certification report must have passed
        # The reports are the evidence that the attached wheels ran. Attaching
        # a wheel whose report says `passed: false` would be exactly the
        # unproven claim this project refuses to make.
        run: |
          python - <<'PY'
          import json, pathlib, sys
          reports = sorted(pathlib.Path("certification").glob("*.json"))
          if not reports:
              sys.exit("::error::no certification report; refusing to attach CUDA wheels")
          for path in reports:
              data = json.loads(path.read_text())
              status = "passed" if data.get("passed") else "FAILED"
              print(f"{path.name}: {status} "
                    f"({data['candidate_backend']} vs {data['reference_backend']}, "
                    f"max_abs={data['max_abs_error']:.3e})")
              if not data.get("passed"):
                  sys.exit(f"::error::{path.name} did not pass")
          PY

      - uses: softprops/action-gh-release@v3
        with:
          # Explicit, because the two entry points disagree about `github.ref`:
          # a tag push gives the tag, a workflow_dispatch gives the branch.
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/*
            assets/*
            certification/*
          generate_release_notes: true
          fail_on_unmatched_files: false

  publish-testpypi:
    needs: github-release
    # `github-release` is skipped in publish_only mode, and a skip propagates,
    # so this has to state its own condition rather than inherit success().
    if: ${{ !cancelled() && (inputs.publish_only || needs.github-release.result == 'success') }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/niverel-mamba
    # Inline, not a reusable workflow. PyPI verifies the PEP 740 attestation
    # against the certificate's Build Config URI, which names the *entry*
    # workflow, while it matches the Trusted Publisher against
    # `job_workflow_ref`, which names the reusable one. Publishing from a
    # reusable workflow makes those two disagree by construction, and the upload
    # is refused: "Certificate's Build Config URI ... does not match expected
    # Trusted Publisher". See pypa/gh-action-pypi-publish#283.
    #
    # So the Trusted Publisher for this project is `release.yml`, on both
    # indexes, and it must stay that way.
    permissions:
      contents: read
      id-token: write        # the only credential used; there is no token
    steps:
      # Deliberately NOT `ref: inputs.tag`. This checkout exists only to provide
      # the composite action below; what gets published comes from the run's
      # artifact or from the release's own assets, never from this tree. Pinning
      # it to the tag means an older tag checks out a tree that predates the
      # action, and the job dies with "Can't find 'action.yml' ... under
      # .github/actions/collect-distributions" -- which is exactly what happened
      # re-publishing v0.1.0.
      - uses: actions/checkout@v7
      - uses: ./.github/actions/collect-distributions
        with:
          publish_only: ${{ inputs.publish_only }}
          tag: ${{ inputs.tag || github.ref_name }}
          github_token: ${{ github.token }}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  cold-install-testpypi:
    needs: publish-testpypi
    if: ${{ !cancelled() && needs.publish-testpypi.result == 'success' }}
    uses: ./.github/workflows/cold-install.yml
    permissions:
      contents: read
    with:
      repository: testpypi

  publish-pypi:
    needs: cold-install-testpypi
    if: ${{ !cancelled() && needs.cold-install-testpypi.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/niverel-mamba
    permissions:
      contents: read
      id-token: write
    steps:
      # Deliberately NOT `ref: inputs.tag`. This checkout exists only to provide
      # the composite action below; what gets published comes from the run's
      # artifact or from the release's own assets, never from this tree. Pinning
      # it to the tag means an older tag checks out a tree that predates the
      # action, and the job dies with "Can't find 'action.yml' ... under
      # .github/actions/collect-distributions" -- which is exactly what happened
      # re-publishing v0.1.0.
      - uses: actions/checkout@v7
      - uses: ./.github/actions/collect-distributions
        with:
          publish_only: ${{ inputs.publish_only }}
          tag: ${{ inputs.tag || github.ref_name }}
          github_token: ${{ github.token }}
      - uses: pypa/gh-action-pypi-publish@release/v1

  cold-install-pypi:
    needs: publish-pypi
    if: ${{ !cancelled() && needs.publish-pypi.result == 'success' }}
    uses: ./.github/workflows/cold-install.yml
    permissions:
      contents: read
    with:
      repository: pypi
