name: cold-install

# Installing from the index it was just published to, on a clean machine.
#
# This is reusable, and may stay reusable: it uses no OIDC. The *publishing*
# job cannot, which is why it lives inline in release.yml -- PyPI verifies an
# attestation against `workflow_ref`, the entry workflow, while it matches the
# Trusted Publisher against `job_workflow_ref`, the reusable one. With a
# reusable publisher the two can never agree, and the upload is rejected with
# "Certificate's Build Config URI does not match expected Trusted Publisher".

on:
  workflow_call:
    inputs:
      repository:
        description: "pypi or testpypi"
        type: string
        required: true

permissions:
  contents: read

jobs:
  cold-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}" }
      - name: wait for the index to catch up
        run: sleep 60
      - name: install from the index it was just published to
        run: |
          INDEX=""
          if [ "${{ inputs.repository }}" = "testpypi" ]; then
            INDEX="--index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/"
          fi
          python -m pip install $INDEX niverel-mamba
      - name: smoke test the core install
        run: |
          python -c "
          import sys, niverel_mamba
          from niverel_mamba import Mamba2Config, default_contract
          assert 'torch' not in sys.modules and 'mlx' not in sys.modules
          c = Mamba2Config(d_model=768, d_state=128, d_conv=4, expand=2)
          assert (c.d_inner, c.nheads, c.d_in_proj) == (1536, 24, 3352)
          assert default_contract().upstream_version == '2.3.2.post1'
          print('cold install OK', niverel_mamba.__version__)
          "

      - name: the commands a user runs before installing anything else
        # Regression guard: 0.1.0 pre-release, `doctor` crashed on a cold
        # install with ModuleNotFoundError: numpy, pulled in transitively by
        # `verify`. doctor exits 1 when no backend is usable, which is the
        # correct answer here and not a failure of the command itself.
        run: |
          niverel-mamba doctor || [ $? -eq 1 ]
          niverel-mamba inspect | grep -q 'in_proj.weight'
          niverel-mamba --version

      - name: verify must refuse cleanly without a framework, not traceback
        run: |
          set +e
          out=$(niverel-mamba verify --fixture tiny 2>&1); code=$?
          set -e
          echo "$out"
          [ $code -eq 2 ] || { echo "::error::expected exit 2, got $code"; exit 1; }
          echo "$out" | grep -q "needs PyTorch" || { echo "::error::unclear message"; exit 1; }
          echo "$out" | grep -qi "traceback" && { echo "::error::leaked a traceback"; exit 1; }
          true
      - name: the torch extra must also install cleanly
        run: |
          python -m pip install "niverel-mamba[torch]"
          python -c "
          import torch
          from niverel_mamba.torch import Mamba2
          from niverel_mamba import Mamba2Config
          m = Mamba2(Mamba2Config(d_model=32, d_state=8, headdim=8, chunk_size=8))
          y = m(torch.randn(1, 12, 32))
          assert y.shape == (1, 12, 32)
          print('torch extra OK')
          "
