name: build-cuda-wheels

# Wheels are built here but are NEVER published from here. Publication requires
# a GPU certification run (certify-cuda-sm80 / sm90) to have passed on the
# resulting artefacts. A GPU is not needed to *compile* CUDA code, only to
# trust it.

on:
  # Callable so that release.yml can build in the same run: the wheels then
  # land as artifacts the certification and release jobs can read directly,
  # with no run id to thread through.
  workflow_call:
    inputs:
      target:
        required: false
        type: string
        default: all
  workflow_dispatch:
    inputs:
      target:
        description: "which build target to run"
        required: false
        default: torch211-cu128
        type: choice
        options: [torch211-cu128, torch212-cu130, torch213-cu130, all]
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "scripts/build_upstream_cuda_wheels.py"
      - ".github/workflows/build-cuda-wheels.yml"

permissions:
  contents: read

jobs:
  # The `target` input was previously declared and then ignored, so every
  # dispatch compiled all three runtimes whatever you asked for. Each target
  # builds causal-conv1d and mamba-ssm for two GPU architectures -- hours of
  # nvcc -- so selecting one matters both for iterating and for staying inside
  # a job's six-hour ceiling. The matrix lives in .github/cuda-targets.json so
  # there is exactly one place to change it.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: select
        env:
          TARGET: ${{ inputs.target || 'all' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib, sys
          every = json.loads(pathlib.Path(".github/cuda-targets.json").read_text())["targets"]
          target = os.environ["TARGET"]
          chosen = every if target == "all" else [t for t in every if t["name"] == target]
          if not chosen:
              sys.exit(f"unknown target {target!r}; known: {[t['name'] for t in every]}")
          print("matrix=" + json.dumps({"include": chosen}))
          PY
          echo "selected:"; cat "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    # Needed to push the layer cache to GHCR. See the cache steps below for why
    # the cache does not live in the Actions cache any more.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h /

      - uses: docker/setup-buildx-action@v4

      - name: log in to GHCR, which stores the layer cache
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: resolve the cache image reference
        id: cache_ref
        # Image references must be lowercase; repository names need not be.
        run: echo "ref=ghcr.io/$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')-buildcache" >> "$GITHUB_OUTPUT"

      - name: build the wheels
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # TORCH_CUDA_ARCH_LIST is deliberately narrow: building every NVIDIA
          # architecture multiplies build time for architectures nobody has
          # certified.
          build-args: |
            TORCH_CUDA_ARCH_LIST=${{ matrix.arch_list }}
            MAMBA_SSM_VERSION=2.3.2.post1
            CAUSAL_CONV1D_VERSION=1.6.2.post1
          # Not `type=gha`. The Actions cache is capped at 10 GB per repository,
          # and `mode=max` exports every intermediate layer -- here a CUDA devel
          # base plus a torch install, so roughly 6-7 GiB per target. Three
          # targets cannot coexist in that budget, so GitHub evicted them LRU:
          # a measured run had torch211 hitting a complete cache and finishing
          # in 2 minutes while torch212 kept an index whose blobs were gone and
          # torch213 had been evicted outright, both rebuilding for ~70 minutes.
          # Worse, the survivor rotates between runs, and the 8+ GiB squeezes
          # every other workflow's cache out of the same budget.
          #
          # A registry cache has no such cap, and on a public repository GHCR
          # storage is free.
          cache-from: type=registry,ref=${{ steps.cache_ref.outputs.ref }}:${{ matrix.name }}
          # `ignore-error` so that a build still succeeds when the cache cannot
          # be written -- a token without packages:write must not turn a
          # perfectly good set of wheels into a failed release.
          cache-to: type=registry,ref=${{ steps.cache_ref.outputs.ref }}:${{ matrix.name }},mode=max,ignore-error=true
          outputs: type=local,dest=./wheelhouse-${{ matrix.name }}

      - name: write the binary manifest
        run: |
          python scripts/build_upstream_cuda_wheels.py manifest \
            --wheelhouse "wheelhouse-${{ matrix.name }}" \
            --torch-version "${{ matrix.torch }}" \
            --torch-cuda "${{ matrix.cuda }}" \
            --python-tag "${{ matrix.python_tag }}" \
            --architectures "sm_80,sm_90" \
            --source-commit "${{ github.sha }}" \
            --build-workflow "${{ github.workflow }}#${{ github.run_id }}" \
            --output "wheelhouse-${{ matrix.name }}/manifest.json"
          cat "wheelhouse-${{ matrix.name }}/manifest.json"

      - uses: actions/upload-artifact@v7
        with:
          name: cuda-wheels-${{ matrix.name }}
          path: wheelhouse-${{ matrix.name }}/

  cold-install:
    # A wheel that cannot be installed into a clean environment is not a wheel.
    # Mirrors the same selected matrix, so building one target does not fail on
    # artefacts the other two never produced.
    needs: [plan, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cuda-wheels-${{ matrix.name }}
          path: wheelhouse
      - name: verify every recorded SHA-256
        run: python scripts/verify_release_assets.py --wheelhouse wheelhouse
      - name: install without compiling anything
        run: |
          python -m venv /tmp/cold
          /tmp/cold/bin/pip install --no-deps --only-binary :all: wheelhouse/*.whl
          echo "installed with no local compilation"
