name: nightly-upstream

# Non-blocking by design. A break here opens an issue; it never fails a PR and
# never invalidates an already-released version.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  moving-targets:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "torch 2.11 latest patch", spec: "torch~=2.11.0", index: "https://download.pytorch.org/whl/cpu" }
          - { label: "torch 2.12 latest patch", spec: "torch~=2.12.0", index: "https://download.pytorch.org/whl/cpu" }
          - { label: "torch 2.13 stable",       spec: "torch~=2.13.0", index: "https://download.pytorch.org/whl/cpu" }
          - { label: "torch nightly",           spec: "torch",         index: "https://download.pytorch.org/whl/nightly/cpu" }
    outputs:
      failed: ${{ job.status }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: |
          uv venv --python 3.12
          uv pip install "${{ matrix.spec }}" --index-url "${{ matrix.index }}" --prerelease allow
          uv pip install -e ".[dev]" einops
      - run: uv run python scripts/make_golden_fixture.py
      - run: uv run pytest tests/unit tests/torch_reference -q

  upstream-mamba-ssm:
    # Watches for a new mamba-ssm release changing the weight contract.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --extra torch --extra dev
      - name: has upstream released a version we do not pin?
        run: |
          uv run python - <<'PY'
          import json, urllib.request
          from niverel_mamba.schema import default_contract
          pinned = default_contract().upstream_version
          latest = json.load(urllib.request.urlopen(
              "https://pypi.org/pypi/mamba-ssm/json"))["info"]["version"]
          print(f"pinned={pinned} latest={latest}")
          if latest != pinned:
              print(f"::warning::mamba-ssm {latest} is out; the contract is pinned to {pinned}. "
                    "Re-run scripts/extract_weight_contract.py against it before adopting.")
          PY

  report:
    needs: [moving-targets, upstream-mamba-ssm]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = `nightly-upstream failed on ${new Date().toISOString().slice(0, 10)}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'nightly',
            });
            if (existing.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ['nightly'],
              body: `A moving upstream target broke the nightly run.\n\n` +
                    `This does **not** affect the released version. See ` +
                    `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
