name: certify-cuda

# Certify the cuda-reference backend on real hardware, on a RunPod pod that is
# started for the occasion and stopped again afterwards.
#
# The pods are created once by hand -- `niverel-mamba-certif-a100` (sm_80) and
# `niverel-mamba-certif-h100` (sm_90) -- and carry a self-hosted runner that
# comes up with them. This workflow only starts and stops them.
#
# Three properties are load-bearing:
#
#   * `start-pod` runs in the `gpu` environment, so a human approves before any
#     GPU begins billing. Nothing before that point costs money.
#   * `stop-pod` is `if: always()`. It must stop the pod when the certification
#     fails, when the runner never appears, and when the run is cancelled --
#     those are exactly the paths where a machine gets forgotten.
#   * `guard` then asserts no certification pod is left running, so a teardown
#     that silently failed becomes a red workflow rather than a slow leak.
#
# A GPU is not needed to *build* the wheels; only to run them. See RELEASING.md.

on:
  workflow_call:
    inputs:
      arch:
        description: "sm80 or sm90"
        required: true
        type: string
      pod:
        description: "name of the RunPod pod carrying the runner"
        required: true
        type: string
      wheel_run_id:
        description: "run holding the cuda-wheels artifacts; empty means this run"
        required: false
        type: string
        default: ""
    secrets:
      RUNPOD_API_KEY:
        required: true
      HF_TOKEN:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  start-pod:
    runs-on: ubuntu-latest
    # Approval gate. Configure a required reviewer on this environment: it is
    # the only thing standing between a tag push and a GPU bill.
    environment: gpu
    steps:
      - uses: actions/checkout@v7
      - name: start ${{ inputs.pod }}
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python3 scripts/runpod_pod.py start "${{ inputs.pod }}" --wait --timeout 900

  certify:
    needs: start-pod
    runs-on: [self-hosted, linux, x64, cuda, "${{ inputs.arch }}"]
    # The pod bills for every minute of this. A run takes about fifteen; forty
    # is generous and still bounded, which matters because a job waiting for a
    # runner that never registers would otherwise wait six hours.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: report the GPU actually present
        run: |
          nvidia-smi
          python3 -c "import torch; print(torch.__version__, torch.version.cuda, torch.cuda.get_device_capability(0))" || true

      - name: refuse to run on the wrong architecture
        # A report labelled sm_80 produced by something else would be worse
        # than no report at all.
        run: |
          python3 - <<'PY'
          import sys, torch
          major, minor = torch.cuda.get_device_capability(0)
          actual, expected = f"sm_{major}{minor}", "${{ inputs.arch }}".replace("sm", "sm_")
          if actual != expected:
              sys.exit(f"::error::this runner is {actual}, not {expected}; refusing to label the report")
          print("architecture confirmed:", actual)
          PY

      - name: fetch the wheels built in this run
        if: inputs.wheel_run_id == ''
        uses: actions/download-artifact@v8
        with:
          pattern: cuda-wheels-*
          path: wheelhouse
          merge-multiple: true

      - name: fetch the wheels from a nominated run
        if: inputs.wheel_run_id != ''
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.wheel_run_id }}
          github-token: ${{ github.token }}
          pattern: cuda-wheels-*
          path: wheelhouse
          merge-multiple: true

      - name: verify every SHA-256 before installing
        run: python3 scripts/verify_release_assets.py --wheelhouse wheelhouse

      - name: cold install, no compilation
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --no-deps --only-binary :all: wheelhouse/*.whl
          .venv/bin/pip install --quiet -e ".[dev]" einops
          .venv/bin/niverel-mamba doctor

      - name: build fixtures, including the real Foundation V3 block
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          .venv/bin/python scripts/make_golden_fixture.py
          if [ -n "$HF_TOKEN" ]; then
            .venv/bin/python scripts/make_golden_fixture.py --only-niverel
          else
            echo "::warning::HF_TOKEN not set; the real V3 fixture will skip by name"
          fi

      - name: cuda-reference parity
        run: .venv/bin/python -m pytest tests/cuda tests/niverel -q

      - name: certification report
        run: |
          .venv/bin/niverel-mamba verify --fixture segmented --device cuda \
            --report certification-${{ inputs.arch }}.json
          cat certification-${{ inputs.arch }}.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: certification-${{ inputs.arch }}
          path: certification-${{ inputs.arch }}.json

      - name: leave nothing behind on the pod
        if: always()
        run: rm -rf .venv wheelhouse fixtures/niverel/*.safetensors || true

  stop-pod:
    needs: [start-pod, certify]
    # Runs on every path, including a rejected approval, a runner that never
    # came up, and a cancelled workflow.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: stop ${{ inputs.pod }}
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python3 scripts/runpod_pod.py stop "${{ inputs.pod }}"

  guard:
    needs: stop-pod
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: no certification pod may be left running
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python3 scripts/runpod_pod.py assert-all-stopped
