name: certify-cuda

# Certify cuda-reference on real hardware, on a RunPod pod that exists only for
# the length of this workflow.
#
# The pod is created, boots straight into a GitHub runner registered
# `--ephemeral`, takes exactly one job, and is destroyed. Nothing persists: no
# idle volume billing between releases, and no standing self-hosted runner on a
# public repository.
#
# What bounds the bill, in order of how much each one matters:
#
#   * `create-pod` runs in the `gpu` environment, so a required reviewer stands
#     between a tag push and any GPU billing. Everything before it is free.
#   * `terminate` is `if: always()`. It must destroy the pod when certification
#     fails, when the runner never registers, and when the run is cancelled --
#     those are precisely the paths where a machine gets forgotten.
#   * `guard` then asserts no pod of ours survives, and fails *closed*: being
#     unable to check is not the same as having checked.
#
# A GPU is not needed to build the wheels, only to run them. See RELEASING.md.

on:
  workflow_call:
    inputs:
      arch:
        description: "sm80 or sm90"
        required: true
        type: string
      measure_only:
        description: >
          observe the tolerance classes without passing judgement. The CUDA
          campaign reports its numbers and succeeds whatever they are, so a run
          on rented hardware yields evidence instead of stopping at the first
          comparison scored against a band nobody has measured yet.
        required: false
        type: boolean
        default: false
      wheel_run_id:
        description: "run holding the cuda-wheels artifacts; empty means this run"
        required: false
        type: string
        default: ""
    secrets:
      RUNPOD_API_KEY:
        required: true
      RUNNER_PAT:
        required: true
      HF_TOKEN:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  create-pod:
    runs-on: ubuntu-latest
    # The approval gate. Give this environment a required reviewer.
    environment: gpu
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: mint a runner registration token
        id: token
        # GITHUB_TOKEN cannot do this. Registering a self-hosted runner is a
        # repository-administration call, and `administration` is not among the
        # scopes a workflow may request -- the valid ones are actions, checks,
        # contents, deployments, discussions, id-token, issues, packages, pages,
        # pull-requests, repository-projects, security-events and statuses.
        # Asking for it does not degrade gracefully either: the workflow file is
        # rejected outright with "Unexpected value 'administration'".
        #
        # So this needs a fine-grained PAT scoped to this repository with
        # Administration: read and write, and nothing else.
        env:
          GH_TOKEN: ${{ secrets.RUNNER_PAT }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::RUNNER_PAT is not set. Create a fine-grained personal access"
            echo "::error::token limited to this repository, with Administration: read and"
            echo "::error::write as its only permission, and add it as a repository secret."
            exit 1
          fi
          token=$(gh api -X POST \
            "repos/${{ github.repository }}/actions/runners/registration-token" \
            --jq .token)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: create the ${{ inputs.arch }} pod
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          python3 scripts/runpod_pod.py create \
            --arch "${{ inputs.arch }}" \
            --run-id "${{ github.run_id }}" \
            --runner-token "${{ steps.token.outputs.token }}" \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" \
            --wait

  certify:
    needs: create-pod
    runs-on: [self-hosted, linux, x64, cuda, "${{ inputs.arch }}"]
    # The pod bills for every minute of this. A run takes about fifteen; forty
    # bounds the case where the runner never registers, which would otherwise
    # sit at the six-hour default.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: report the GPU and the disk actually present
        # The disk matters as much as the GPU here: the fixture step pulls a
        # 1.7 GB checkpoint, and every runtime installs its own CUDA torch.
        run: |
          nvidia-smi
          df -h / "$HOME" 2>/dev/null || df -h /
          python3 -c "import torch; print(torch.__version__, torch.version.cuda, torch.cuda.get_device_capability(0))" || true

      - name: refuse to run on the wrong architecture
        # A report labelled sm_80 produced by something else would be worse
        # than no report at all.
        run: |
          python3 - <<'PY'
          import sys, torch
          major, minor = torch.cuda.get_device_capability(0)
          actual, expected = f"sm_{major}{minor}", "${{ inputs.arch }}".replace("sm", "sm_")
          if actual != expected:
              sys.exit(f"::error::this runner is {actual}, not {expected}; refusing to label the report")
          print("architecture confirmed:", actual)
          PY

      - name: fetch the wheels built in this run
        if: inputs.wheel_run_id == ''
        uses: actions/download-artifact@v8
        with:
          pattern: cuda-wheels-*
          path: wheelhouse
          # NOT merged. All three artifacts contain a manifest.json and wheels
          # with identical filenames, so merging them into one directory leaves
          # one target's manifest next to another target's wheels -- which is
          # exactly the SHA-256 mismatch that stopped the first GPU run.
          merge-multiple: false

      - name: fetch the wheels from a nominated run
        if: inputs.wheel_run_id != ''
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.wheel_run_id }}
          github-token: ${{ github.token }}
          pattern: cuda-wheels-*
          path: wheelhouse
          # NOT merged. All three artifacts contain a manifest.json and wheels
          # with identical filenames, so merging them into one directory leaves
          # one target's manifest next to another target's wheels -- which is
          # exactly the SHA-256 mismatch that stopped the first GPU run.
          merge-multiple: false

      - name: verify every SHA-256, in every wheelhouse
        run: python3 scripts/verify_release_assets.py --wheelhouse wheelhouse

      - name: build fixtures, including the real Foundation V3 block
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -m venv .venv-fixtures
          # torch is deliberately not a core dependency -- an MLX user must not
          # have to download it -- so `.[dev]` alone leaves the fixture builder
          # without it. The CPU build, not the CUDA one: these fixtures are the
          # portable golden reference, they are computed on CPU by design, and
          # pulling three gigabytes of CUDA torch onto a billing GPU to produce
          # them would be paying for nothing. The certified runtimes get their
          # own CUDA torch, one venv each, further down.
          .venv-fixtures/bin/pip install --quiet "torch>=2.11,<2.14" \
            --index-url https://download.pytorch.org/whl/cpu
          .venv-fixtures/bin/pip install --quiet -e ".[torch,dev]"
          .venv-fixtures/bin/python scripts/make_golden_fixture.py
          if [ -n "$HF_TOKEN" ]; then
            .venv-fixtures/bin/python scripts/make_golden_fixture.py --only-niverel
          else
            echo "::warning::HF_TOKEN not set; the real V3 fixture will skip by name"
          fi

      - name: certify every runtime we ship
        # One venv per target. The wheels are compiled against a specific torch
        # ABI, so certifying one runtime says nothing about the others -- and we
        # ship all three. Each gets its own report.
        run: |
          set -euo pipefail
          mkdir -p reports
          for dir in wheelhouse/cuda-wheels-*/; do
            target=$(basename "$dir")
            read -r tv tc < <(python3 -c "
          import json, sys
          a = json.load(open('$dir/manifest.json'))['artifacts'][0]
          print(a['torch_version'], a['torch_cuda'])")
            index="https://download.pytorch.org/whl/cu${tc//./}"
            echo "::group::$target — torch $tv, CUDA $tc"

            venv=".venv-$target"
            python3 -m venv "$venv"
            "$venv/bin/pip" install --quiet --upgrade pip
            "$venv/bin/pip" install --quiet "torch==$tv" --index-url "$index"
            # --only-binary is the point of the whole exercise: a supported
            # install must never compile on the user's machine.
            "$venv/bin/pip" install --quiet --no-deps --only-binary :all: "$dir"*.whl
            # transformers is upstream's, not ours: mamba_ssm/__init__.py reaches
            # models.mixer_seq_simple -> utils.generation -> transformers at import
            # time, and --no-deps (which is what protects the pinned torch build)
            # leaves it out. Without it the wheels install and the package does
            # not import.
            "$venv/bin/pip" install --quiet -e ".[dev]" einops transformers

            # In a FRESH process, before anything else touches mamba_ssm.
            # Upstream's __init__ imports modules.mamba2 *before* the line that
            # used to fail, so a failed package import still leaves that
            # submodule in sys.modules -- and a later import inside the same
            # process succeeds from that cache. A certification passed its
            # parity tests that way, against a backend no fresh process could
            # load. This step is the one that cannot be fooled by it.
            "$venv/bin/python" -c "
          from mamba_ssm.modules.mamba2 import Mamba2
          print('    upstream Mamba2 imports in a fresh process:', Mamba2.__module__)"

            "$venv/bin/niverel-mamba" doctor

            "$venv/bin/python" -m pytest tests/cuda tests/niverel -q

            # Two campaigns, two reports, because a report certifies exactly one
            # backend. The first is the portable implementation against its own
            # float64 oracle -- a real gate, and a statement about
            # torch-reference even when it runs on an A100. The second is the
            # one that says anything about the CUDA kernels.
            #
            # v0.1.0 shipped only the first, on both architectures, and it was
            # read as CUDA certification because of the hardware it ran on.
            base="reports/certification-${{ inputs.arch }}-$target"
            "$venv/bin/niverel-mamba" verify --fixture segmented --device cuda \
              --report "$base-torch-reference.json"
            measure=""
            if [ "${{ inputs.measure_only }}" = "true" ]; then measure="--measure"; fi
            # shellcheck disable=SC2086
            "$venv/bin/niverel-mamba" verify --fixture segmented --certify cuda-reference \
              $measure --report "$base-cuda-reference.json"
            cat "$base-torch-reference.json" "$base-cuda-reference.json"

            rm -rf "$venv"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: certification-${{ inputs.arch }}
          path: reports/

  terminate:
    needs: [create-pod, certify]
    # Every path, including a rejected approval, a runner that never came up,
    # and a cancelled workflow.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: destroy the ${{ inputs.arch }} pod
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          python3 scripts/runpod_pod.py terminate \
            --arch "${{ inputs.arch }}" --run-id "${{ github.run_id }}"

  guard:
    needs: terminate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: no certification pod may survive
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python3 scripts/runpod_pod.py assert-none-running
