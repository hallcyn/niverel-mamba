# Sealed numerical tolerances.
#
# These are OBSERVED values, then sealed. The rule is
# absolute: an agent (or a human) must not widen a tolerance until a test
# passes. If a measurement exceeds its band, that is a finding to report, not
# a number to adjust.
#
# `observed` records what the certification run actually measured on the
# reference hardware, so drift is visible without re-running anything. The
# pass criterion is the allclose form:
#
#     |candidate - reference| <= atol + rtol * |reference|
#
# `max_rel_error` in a report is computed only over elements whose reference
# magnitude exceeds `rel_floor`; below that, relative error is meaningless
# noise (a reference value of 1e-9 makes any absolute difference look huge)
# and reporting it would mislead rather than inform.

schema_version: niverel-mamba-tolerances-v1

sealed_on: 2026-08-17
sealed_hardware: Apple M1, macOS 26.0.1, torch 2.13.0, mlx 0.32.0
sealed_by: scripts/verify_release_assets.py + tests/certification

classes:
  cpu_float64:
    atol: 1.0e-10
    rtol: 1.0e-9
    rel_floor: 1.0e-8
    description: >-
      Sequential oracle against the chunked implementation, both in float64 on
      CPU. This is the tightest claim the package makes and the one every
      other tolerance is ultimately anchored to.
    observed:
      chunked_vs_sequential_max_abs: 1.07e-14
      forward_vs_step_max_abs: 1.6e-15
      segmented_vs_separate_max_abs: 4.4e-16
      upstream_ssd_minimal_max_abs: 3.6e-15

  cpu_float32:
    atol: 2.0e-5
    rtol: 2.0e-4
    rel_floor: 1.0e-4
    description: Chunked against the sequential oracle, float32 on CPU.
    observed:
      chunked_vs_sequential_max_abs: 3.4e-6
      chunked_vs_per_segment_max_abs: 3.8e-6

  mps_float32:
    atol: 1.0e-4
    rtol: 1.0e-3
    rel_floor: 1.0e-3
    description: >-
      torch-reference on MPS against torch-reference on CPU, both float32,
      real Foundation V3 weights.
    observed:
      cpu_vs_mps_l96_max_abs: 4.6e-6
      cpu_vs_mps_l8192_max_abs: 1.9e-5

  mlx_float32:
    atol: 1.0e-4
    rtol: 1.0e-3
    rel_floor: 1.0e-3
    description: MLX against torch-reference CPU, float32, real V3 weights.
    observed:
      torch_vs_mlx_max_abs: 1.15e-5
      mlx_chunked_vs_sequential_max_abs: 3.6e-6
      mlx_forward_vs_step_max_abs: 8.6e-6

  cuda_float32:
    atol: 5.0e-3
    rtol: 1.0e-3
    rel_floor: 1.0e-2
    description: >-
      cuda-reference against torch-reference, both float32, on the same GPU.
      This is the certification gate, and it is a gate on the *algorithm*: a
      disagreement here can only come from reassociation, chunk boundaries, or
      how a segment reset is applied. Anything genuinely wrong -- a mishandled
      reset above all -- produces an O(1) difference and cannot hide under this
      band.
      The band is set by the arithmetic the hardware performs, which is not
      float32. Upstream's thirty `tl.dot` calls pass no `allow_tf32` and none
      appears anywhere in the package, so Ampere and Hopper multiply in TF32:
      ten mantissa bits, one epsilon of 4.9e-04. Accumulated across a 257-step
      scan that reaches sqrt(256) * 4.9e-04 = 7.8e-03 in the worst case. The
      measurement below sits at 2.5e-03, a third of that, and this band is set
      at 5.0e-03 -- twice the observation and still under the theoretical
      ceiling. Our reference meanwhile runs `matmul.allow_tf32 = False` and
      `float32_matmul_precision = "highest"`, so what is measured is upstream's
      TF32 against true float32.
      `rel_floor` was raised from 1.0e-3 to 1.0e-2 because the reported
      `max_rel_error` was 0.50, entirely from elements a thousand times below
      the output RMS where an absolute error of 2.5e-03 is bound to look
      enormous. It affects the reported statistic only: the pass criterion is
      the allclose form and never consults it.
    observed:
      # Measured on release run 32455074823, in measurement mode, on the
      # segmented fixture. Bit-identical on both architectures and across all
      # three torch runtimes, which is itself worth recording: the kernels are
      # deterministic across Ampere and Hopper.
      hardware: NVIDIA A100-SXM4-80GB (sm_80) and NVIDIA H100 80GB HBM3 (sm_90)
      forward_max_abs: 2.4970e-3
      segment_reset_max_abs: 2.4972e-3
      forward_mean_abs: 8.88e-5
      segment_reset_mean_abs: 7.86e-5
      cosine_similarity: 0.999999988

  cuda_float32_backward:
    atol: 3.0e-3
    rtol: 3.0e-3
    rel_floor: 1.0e-2
    description: >-
      Gradients of cuda-reference against torch-reference, both float32, on the
      same GPU, pushed by the same seeded cotangent. This is the condition
      `Capability.backward` states for itself, and passing it is what lets
      `backward` and `training` stop being provisional.
      Both sides are divided by the reference's peak before comparing, so the
      band is scale-free. That is not a detail. Gradient magnitudes are set by
      the cotangent and so is the deviation; both move together. Measured across
      twelve draws on the segmented fixture, max|grad| varies by a factor of
      3.09 between the smallest and the largest, so a band in absolute units
      calibrated on one draw is calibrated on nothing. The first version of this
      row was exactly that mistake -- 3.03e-02 observed, 1.0e-01 sealed, and a
      plausible 9.4e-02 on a different draw, leaving a margin of 1.1. It was
      caught before it cost a rental rather than after, which is the only
      difference between it and the three that did.
      Normalised, what is measured is the relative deviation, a property of the
      arithmetic and not of the draw. Upstream multiplies in TF32: ten mantissa
      bits, one epsilon of 4.9e-04. The observations are below that. The band is
      six to nine times them, which still catches anything algebraic -- a
      mishandled reset or a wrong chunk boundary moves a gradient by a
      noticeable fraction of its own size, not by a thousandth.
    observed:
      # Deviations measured on release run 32478644509 (A100 sm_80 and H100
      # sm_90); the magnitudes they are divided by were computed on CPU from the
      # same fixture and weights.
      hardware: NVIDIA A100-SXM4-80GB (sm_80) and NVIDIA H100 80GB HBM3 (sm_90)
      parameters_compared: 8
      parameters_on_one_side_only: 0
      worst_parameter: in_proj.weight
      worst_parameter_relative: 3.4e-4
      worst_parameter_raw_max_abs: 3.032e-2
      worst_parameter_reference_max_abs: 88.67
      input_grad_relative: 6.2e-4
      input_grad_raw_max_abs: 6.477e-3
      input_grad_reference_max_abs: 10.45

  cuda_bfloat16:
    atol: 2.0e-2
    rtol: 2.0e-2
    rel_floor: 1.0e-2
    description: >-
      NOT A GATE, and never again. This row records what bfloat16 costs, so that
      someone choosing it knows what they are choosing. It is not a criterion,
      because gating on it measures the number format rather than the kernels.
      Three certification runs were lost proving that. Against an unrounded
      float32 reference the deviation is 2.9e-02, of which the portable
      implementation alone -- no CUDA, no upstream kernels, merely rounding
      inputs and weights -- already accounts for 3.0e-02. Feeding both sides the
      same bfloat16 data removes the input rounding and leaves 1.9e-02 to
      2.6e-02, which is the arithmetic inside the kernel: mean_abs 2.9e-03 on
      outputs of RMS one, 0.29% against bfloat16's own 0.39% of relative
      precision. No correct implementation can be certified out of that.
      The gate is `cuda_float32` above. Every certification run measures this
      and writes it into the report under `bfloat16_measured`.
    observed:
      # Release run 32455074823, segmented fixture, identical on sm_80 and sm_90.
      hardware: NVIDIA A100-SXM4-80GB (sm_80) and NVIDIA H100 80GB HBM3 (sm_90)
      forward_at_equal_data_max_abs: 1.8515e-2
      segment_reset_at_equal_data_max_abs: 2.5789e-2
      forward_vs_unrounded_float32_max_abs: 2.9495e-2
      segment_reset_vs_unrounded_float32_max_abs: 3.2903e-2
      mean_abs_at_equal_data: 2.88e-3
